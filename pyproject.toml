[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrin"
version = "0.1.0"
description = "AgriN — self-hostable digital agriculture intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.1",
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "pydantic-settings==2.15.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "PyJWT==2.15.0",
    "geoalchemy2==0.20.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
include = ["src*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision templates import `op`/`sa` for use by future revisions.
"alembic/versions/*.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["\\.venv", "build", "dist", "\\.git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
