services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agrin
      POSTGRES_PASSWORD: agrin
      POSTGRES_DB: agrin
    ports:
      - "65432:5432"
    volumes:
      - agrin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrin -d agrin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrin_pgdata:
